[package]
name = "MetaSort"
version = "1.1.0-bberka"
edition = "2021"
authors = ["Sanmith S", "Berkay"]
description = "MetaSort v1.1.0-bberka – Cross-platform Google Photos Takeout Organizer with Parallel Processing"
license = "Apache-2.0"
repository = "https://github.com/bberka/MetaSort"

[dependencies]
walkdir = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
csv = "1.3"
fs_extra = "1.3"
url = "2"
indicatif = "0.17"
rayon = "1.10"

# Note: exiftool must be installed on the system (external dependency)
# Cross-platform support: macOS, Windows, and Linux 